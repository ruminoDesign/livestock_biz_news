<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>축산업계 이슈 공유</title>

<script>
  // ===== 여기 세 줄만 바꾸세요 =====
  const SUPABASE_URL = 'https://skaxtgmrbpnozblkwfxm.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zhFOlQwY20_wycr3nJgaCw_EzkIMMf2';
  const LOGO_URL     = 'https://github.com/ruminoDesign/imageSource/blob/main/logoEG2.png?raw=true';
  // ================================
  const DEPARTMENT   = '마케팅';   // 출력 양식의 부서명
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --text:#1d2329; --muted:#6b7480;
    --line:#e1e4e9; --accent:#2f6fde; --accent-text:#fff; --danger:#d64545;
    --hover:#eef2f8; --field:#ffffff; --sel:#e6eefc;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141619; --panel:#1d2024; --text:#e6e8eb; --muted:#9aa3ad;
      --line:#32363c; --accent:#5b8ff0; --accent-text:#fff; --danger:#ef6b6b;
      --hover:#262a30; --field:#16181b; --sel:#22304a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-size:15px;
       font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
  [hidden]{display:none !important}
  button,input,select,textarea{font:inherit;color:inherit}
  input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  input[type=checkbox]{width:17px;height:17px;padding:0;cursor:pointer;accent-color:var(--accent)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  textarea{resize:vertical;line-height:1.6}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08)}
  .btn.danger{color:var(--danger)}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}

  /* 로그인 */
  #loginView{min-height:100vh;display:grid;place-items:center;padding:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px}
  .card h1{font-size:20px;margin:0 0 18px}
  .card .row{margin-bottom:12px}
  .msg{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}

  /* 상단 */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0}
  .user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}

  /* 검색 */
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
           display:grid;grid-template-columns:140px 140px 160px 1fr auto auto;gap:8px;align-items:end;margin-bottom:12px}
  @media (max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters .kw{grid-column:1/-1}}

  .bar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;gap:8px;flex-wrap:wrap}
  .bar .right{display:flex;gap:8px;flex-wrap:wrap}
  .count{color:var(--muted);font-size:14px}

  /* 목록 */
  .tableBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table.list{width:100%;border-collapse:collapse}
  .list th,.list td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .list th{font-size:13px;color:var(--muted);font-weight:600}
  .list td.title{white-space:normal;min-width:220px}
  .list .chk{width:44px;text-align:center;padding-right:4px;cursor:default}
  .list tbody tr{cursor:pointer}
  .list tbody tr:hover{background:var(--hover)}
  .list tbody tr.selected{background:var(--sel)}
  .list tbody tr:last-child td{border-bottom:none}
  .empty{text-align:center;color:var(--muted);padding:32px;cursor:default}
  @media (max-width:640px){.hide-sm{display:none}}

  .pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0}

  /* 대화상자 */
  dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--text);
         width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlgHead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .dlgHead h2{margin:0;font-size:18px}
  .dlgBody{padding:18px 20px;overflow:auto;max-height:calc(100vh - 180px)}
  .dlgFoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  @media (max-width:640px){.grid4{grid-template-columns:1fr 1fr}}
  .field{margin-bottom:12px}

  .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  @media (max-width:640px){.meta{grid-template-columns:1fr 1fr}}
  .meta div{background:var(--bg);border-radius:8px;padding:8px 10px}
  .meta span{display:block;font-size:12px;color:var(--muted)}
  .section{margin-bottom:16px}
  .section h3{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
  .longtext{white-space:pre-wrap;word-break:break-word;line-height:1.7;background:var(--bg);border-radius:8px;padding:12px;margin:0}
  .stamp{font-size:12px;color:var(--muted)}
  a{color:var(--accent)}

  /* 미리보기 화면 */
  #previewView .toolbar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
                        display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
  #previewView .toolbar .grow{flex:1}
  .pages{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 16px 48px;overflow-x:auto}

  /* ===== 출력 양식 (A4: 794 x 1123px) ===== */
  .report{width:794px;min-height:1123px;flex:none;background:#fff;color:#111;
          padding:72px 82px 46px;display:flex;flex-direction:column;
          font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:12.5px;line-height:1.6;
          box-shadow:0 2px 14px rgba(0,0,0,.18)}
  .r-title{align-self:flex-start;font-size:29px;font-weight:800;letter-spacing:1px;
           padding:0 26px 12px 6px;border-bottom:2px solid #222;margin:0}
  .r-head,.r-body{width:100%;border-collapse:collapse;table-layout:fixed}
  .r-head{margin-top:46px;border-top:2px solid #111;border-bottom:2px solid #111}
  .r-head th{background:#2f3a47;color:#fff;font-weight:700;padding:5px 22px;
             text-align:justify;text-align-last:justify;border-bottom:1px solid #fff}
  .r-head td{text-align:center;padding:5px 8px;border-bottom:1px solid #111}
  .r-head tr:last-child th{border-bottom:none}
  .r-head tr:last-child td{border-bottom:none}
  .r-head td.r-subject{font-weight:700;padding:12px 10px;font-size:13px}
  .r-body{margin-top:12px;border-top:2px solid #111;border-bottom:2px solid #111}
  .r-body th{width:98px;font-weight:700;border-right:1px solid #111;text-align:justify;text-align-last:justify;
             padding:0 30px;vertical-align:middle}
  .r-body td{padding:18px 6px 18px 4px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
  .r-body tr + tr th,.r-body tr + tr td{border-top:1px solid #111}
  .r-body tr.r-comment th,.r-body tr.r-comment td{background:#f1f1f1}
  .r-body tr.r-ref th,.r-body tr.r-ref td{background:#e8f4fc;text-align-last:auto}
  .r-body tr.r-ref th{text-align:center;text-align-last:center;padding:0 8px}
  .r-body b{font-weight:700}
  .r-logo{margin-top:auto;padding-top:40px;text-align:center}
  .r-logo img{height:58px}

  @media print{
    @page{size:A4;margin:0}
    body{background:#fff}
    body > section:not(#previewView), dialog{display:none !important}
    #previewView .toolbar{display:none !important}
    .pages{padding:0;gap:0;display:block}
    .report{box-shadow:none;min-height:296mm;break-after:page}
    .report:last-child{break-after:auto}
  }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<section id="loginView">
  <form id="loginForm" class="card">
    <h1>축산업계 이슈 공유</h1>
    <div class="row"><label for="email">이메일</label><input id="email" type="email" required autocomplete="username"></div>
    <div class="row"><label for="password">비밀번호</label><input id="password" type="password" required autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%" type="submit" id="loginBtn">로그인</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</section>

<!-- 메인 화면 -->
<section id="appView" hidden>
  <div class="wrap">
    <header>
      <h1>축산업계 이슈 공유</h1>
      <div class="user"><span id="userEmail"></span><button class="btn" id="logoutBtn">로그아웃</button></div>
    </header>

    <form class="filters" id="filterForm">
      <div><label for="fFrom">시작일</label><input type="date" id="fFrom"></div>
      <div><label for="fTo">종료일</label><input type="date" id="fTo"></div>
      <div><label for="fCategory">구분</label><select id="fCategory"><option value="">구분 전체</option></select></div>
      <div class="kw"><label for="fKeyword">검색어 (제목·내용·코멘트·성명·레퍼런스)</label><input id="fKeyword" placeholder="검색어 입력 후 Enter"></div>
      <button class="btn primary" type="submit">검색</button>
      <button class="btn" type="button" id="resetBtn">초기화</button>
    </form>

    <div class="bar">
      <span class="count" id="countText"></span>
      <div class="right">
        <button class="btn" id="clearSelBtn" hidden>선택 해제</button>
        <button class="btn" id="printSelBtn" disabled>선택 출력 (0)</button>
        <button class="btn primary" id="newBtn">+ 새 항목</button>
      </div>
    </div>

    <div class="tableBox">
      <table class="list">
        <thead><tr>
          <th class="chk"><input type="checkbox" id="checkAll" title="이 페이지 전체 선택"></th>
          <th>일자</th><th>구분</th><th class="hide-sm">직급</th><th>성명</th><th>제목</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pager">
      <button class="btn" id="prevBtn">‹ 이전</button>
      <span id="pageText" class="count"></span>
      <button class="btn" id="nextBtn">다음 ›</button>
    </div>
  </div>
</section>

<!-- 출력 미리보기 화면 -->
<section id="previewView" hidden>
  <div class="toolbar">
    <button class="btn" id="backBtn">‹ 목록으로</button>
    <span class="count grow" id="previewInfo"></span>
    <button class="btn" id="printBtn">인쇄</button>
    <button class="btn primary" id="pdfBtn">PDF 내려받기</button>
  </div>
  <div class="pages" id="pages"></div>
</section>

<!-- 상세 보기 -->
<dialog id="detailDlg">
  <div class="dlgHead"><h2 id="dTitle"></h2><button class="x" type="button" data-close>×</button></div>
  <div class="dlgBody">
    <div class="meta">
      <div><span>일자</span><b id="dDate"></b></div>
      <div><span>구분</span><b id="dCategory"></b></div>
      <div><span>직급</span><b id="dPosition"></b></div>
      <div><span>성명</span><b id="dName"></b></div>
    </div>
    <div class="section"><h3>내용</h3><p class="longtext" id="dContent"></p></div>
    <div class="section"><h3>코멘트</h3><p class="longtext" id="dComment"></p></div>
    <div class="section"><h3>레퍼런스</h3><p class="longtext" id="dReference"></p></div>
    <div class="stamp" id="dStamp"></div>
  </div>
  <div class="dlgFoot">
    <button class="btn danger" type="button" id="deleteBtn">삭제</button>
    <button class="btn" type="button" id="editBtn">수정</button>
    <button class="btn" type="button" id="printOneBtn">출력</button>
    <button class="btn primary" type="button" data-close>닫기</button>
  </div>
</dialog>

<!-- 입력 / 수정 -->
<dialog id="formDlg">
  <form id="recordForm">
    <div class="dlgHead"><h2 id="formTitle">새 항목</h2><button class="x" type="button" data-close>×</button></div>
    <div class="dlgBody">
      <div class="grid4">
        <div><label for="iDate">일자 *</label><input type="date" id="iDate" required></div>
        <div><label for="iCategory">구분</label><input id="iCategory" list="catList" autocomplete="off" placeholder="예: 해외"></div>
        <div><label for="iPosition">직급</label><input id="iPosition" list="posList" autocomplete="off" placeholder="예: 사원"></div>
        <div><label for="iName">성명 *</label><input id="iName" required></div>
      </div>
      <div class="field"><label for="iTitle">제목 *</label><input id="iTitle" required></div>
      <div class="field">
        <label for="iContent">내용</label>
        <textarea id="iContent" rows="12"></textarea>
        <div class="hint">줄바꿈은 그대로 출력됩니다. <b>**단어**</b>처럼 감싸면 굵게, "1. "로 시작하는 줄과 "핵심 주제 :"는 자동으로 굵게 표시됩니다.</div>
      </div>
      <div class="field"><label for="iComment">코멘트</label><textarea id="iComment" rows="6"></textarea></div>
      <div class="field">
        <label for="iReference">레퍼런스</label>
        <textarea id="iReference" rows="2" maxlength="500" placeholder="[돼지와 사람]&#10;https://..."></textarea>
      </div>
    </div>
    <div class="dlgFoot">
      <button class="btn" type="button" data-close>취소</button>
      <button class="btn primary" type="submit" id="saveBtn">저장</button>
    </div>
  </form>
  <datalist id="catList"></datalist>
  <datalist id="posList"></datalist>
</dialog>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PAGE_SIZE = 20;
const $ = id => document.getElementById(id);

let page = 0;
let total = 0;
let pageIds = [];            // 현재 페이지에 보이는 id들
const selected = new Set();  // 체크된 id (페이지를 넘겨도 유지)
let current = null;          // 상세 보기 중인 레코드
let editingId = null;        // 수정 중인 id (새 항목이면 null)
let currentUserId = null;
let previewRecords = [];

if (SUPABASE_URL.includes('여기에') || SUPABASE_KEY.includes('여기에')) {
  alert('파일 맨 위의 SUPABASE_URL과 SUPABASE_KEY를 먼저 입력하세요.');
}

const today = () => new Date().toLocaleDateString('sv-SE');   // YYYY-MM-DD
const orNull = v => { v = v.trim(); return v === '' ? null : v; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ---------- 로그인 ---------- */
db.auth.onAuthStateChange((_event, session) => {
  setTimeout(() => {
    const uid = session?.user?.id || null;
    if (uid === currentUserId) return;
    currentUserId = uid;
    $('previewView').hidden = true;
    if (uid) {
      $('userEmail').textContent = session.user.email;
      $('loginView').hidden = true;
      $('appView').hidden = false;
      page = 0;
      selected.clear();
      updateSelUI();
      loadOptions();
      loadList();
    } else {
      $('loginView').hidden = false;
      $('appView').hidden = true;
    }
  }, 0);
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginMsg').textContent = '';
  $('loginBtn').disabled = true;
  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });
  $('loginBtn').disabled = false;
  if (error) $('loginMsg').textContent = '로그인 실패: ' + error.message;
});

$('logoutBtn').onclick = () => db.auth.signOut();

/* ---------- 구분 / 직급 목록 ---------- */
async function loadOptions() {
  const { data, error } = await db.from('records').select('category, position').limit(5000);
  if (error) return;
  const uniq = key => [...new Set(data.map(r => r[key]).filter(Boolean))].sort();
  const cats = uniq('category'), poss = uniq('position');

  const sel = $('fCategory'), keep = sel.value;
  sel.replaceChildren(new Option('구분 전체', ''), ...cats.map(c => new Option(c, c)));
  sel.value = cats.includes(keep) ? keep : '';

  $('catList').replaceChildren(...cats.map(c => new Option(c, c)));
  $('posList').replaceChildren(...poss.map(p => new Option(p, p)));
}

/* ---------- 목록 ---------- */
function messageRow(text) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 6; td.className = 'empty'; td.textContent = text;
  tr.append(td);
  return tr;
}

async function loadList() {
  const tbody = $('tbody');
  tbody.replaceChildren(messageRow('불러오는 중…'));

  let q = db.from('records')
    .select('id, record_date, category, position, name, title', { count: 'exact' });

  const from = $('fFrom').value, to = $('fTo').value, cat = $('fCategory').value;
  const kw = $('fKeyword').value.trim().replace(/[",()\\]/g, ' ').trim();

  if (from) q = q.gte('record_date', from);
  if (to)   q = q.lte('record_date', to);
  if (cat)  q = q.eq('category', cat);
  if (kw) {
    const p = `"%${kw}%"`;
    q = q.or(`title.ilike.${p},content.ilike.${p},comment.ilike.${p},name.ilike.${p},reference.ilike.${p}`);
  }

  q = q.order('record_date', { ascending: false })
       .order('id', { ascending: false })
       .range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);

  const { data, error, count } = await q;
  if (error) { tbody.replaceChildren(messageRow('불러오기 실패: ' + error.message)); return; }

  total = count ?? 0;
  if (page > 0 && data.length === 0) { page--; return loadList(); }

  tbody.replaceChildren();
  pageIds = data.map(r => r.id);
  if (data.length === 0) tbody.append(messageRow('기록이 없습니다.'));

  for (const r of data) {
    const tr = document.createElement('tr');
    if (selected.has(r.id)) tr.classList.add('selected');

    // 체크박스 칸
    const tdChk = document.createElement('td');
    tdChk.className = 'chk';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selected.has(r.id);
    cb.addEventListener('change', () => {
      cb.checked ? selected.add(r.id) : selected.delete(r.id);
      tr.classList.toggle('selected', cb.checked);
      updateSelUI();
    });
    tdChk.addEventListener('click', e => { e.stopPropagation(); if (e.target !== cb) cb.click(); });
    tdChk.append(cb);
    tr.append(tdChk);

    const cells = [
      [r.record_date, ''],
      [r.category || '', ''],
      [r.position || '', 'hide-sm'],
      [r.name, ''],
      [r.title, 'title']
    ];
    for (const [text, cls] of cells) {
      const td = document.createElement('td');
      td.textContent = text;
      if (cls) td.className = cls;
      tr.append(td);
    }
    tr.onclick = () => openDetail(r.id);
    tbody.append(tr);
  }

  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  $('countText').textContent = `총 ${total.toLocaleString()}건`;
  $('pageText').textContent = `${page + 1} / ${pages}`;
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = page + 1 >= pages;
  updateSelUI();
}

function updateSelUI() {
  const n = selected.size;
  $('printSelBtn').textContent = `선택 출력 (${n})`;
  $('printSelBtn').disabled = n === 0;
  $('clearSelBtn').hidden = n === 0;
  const onPage = pageIds.filter(id => selected.has(id)).length;
  $('checkAll').checked = pageIds.length > 0 && onPage === pageIds.length;
  $('checkAll').indeterminate = onPage > 0 && onPage < pageIds.length;
}

$('checkAll').addEventListener('change', e => {
  pageIds.forEach(id => e.target.checked ? selected.add(id) : selected.delete(id));
  document.querySelectorAll('#tbody tr').forEach(tr => {
    const cb = tr.querySelector('input[type=checkbox]');
    if (cb) { cb.checked = e.target.checked; tr.classList.toggle('selected', e.target.checked); }
  });
  updateSelUI();
});

$('clearSelBtn').onclick = () => { selected.clear(); loadList(); };
$('printSelBtn').onclick = () => openPreview([...selected]);

$('filterForm').addEventListener('submit', e => { e.preventDefault(); page = 0; loadList(); });
$('resetBtn').onclick = () => { $('filterForm').reset(); page = 0; loadList(); };
$('prevBtn').onclick = () => { if (page > 0) { page--; loadList(); } };
$('nextBtn').onclick = () => { page++; loadList(); };

/* ---------- 상세 보기 ---------- */
async function openDetail(id) {
  const { data, error } = await db.from('records').select('*').eq('id', id).single();
  if (error) return alert('불러오기 실패: ' + error.message);
  current = data;

  $('dTitle').textContent = data.title;
  $('dDate').textContent = data.record_date;
  $('dCategory').textContent = data.category || '—';
  $('dPosition').textContent = data.position || '—';
  $('dName').textContent = data.name;
  $('dContent').textContent = data.content || '—';
  $('dComment').textContent = data.comment || '—';
  $('dReference').textContent = data.reference || '—';

  const fmt = t => new Date(t).toLocaleString('ko-KR');
  $('dStamp').textContent = `등록 ${fmt(data.created_at)} · 수정 ${fmt(data.updated_at)}`;

  if (!$('detailDlg').open) $('detailDlg').showModal();
}

$('editBtn').onclick = () => { $('detailDlg').close(); openForm(current); };
$('printOneBtn').onclick = () => { $('detailDlg').close(); openPreview([current.id]); };

$('deleteBtn').onclick = async () => {
  if (!current || !confirm(`"${current.title}" 항목을 삭제할까요?\n삭제하면 되돌릴 수 없습니다.`)) return;
  const { data, error } = await db.from('records').delete().eq('id', current.id).select('id');
  if (error) return alert('삭제 실패: ' + error.message);
  if (!data.length) return alert('삭제되지 않았습니다. (권한이 없거나 이미 삭제된 항목)');
  selected.delete(current.id);
  $('detailDlg').close();
  current = null;
  loadOptions();
  loadList();
};

/* ---------- 입력 / 수정 ---------- */
function openForm(rec) {
  editingId = rec ? rec.id : null;
  $('formTitle').textContent = rec ? '수정' : '새 항목';
  $('iDate').value      = rec ? rec.record_date : today();
  $('iCategory').value  = rec?.category  || '';
  $('iPosition').value  = rec?.position  || '';
  $('iName').value      = rec?.name      || '';
  $('iTitle').value     = rec?.title     || '';
  $('iContent').value   = rec?.content   || '';
  $('iComment').value   = rec?.comment   || '';
  $('iReference').value = rec?.reference || '';
  $('formDlg').showModal();
  $('iTitle').focus();
}

$('newBtn').onclick = () => openForm(null);

$('recordForm').addEventListener('submit', async e => {
  e.preventDefault();
  const payload = {
    record_date: $('iDate').value,
    category:    orNull($('iCategory').value),
    position:    orNull($('iPosition').value),
    name:        $('iName').value.trim(),
    title:       $('iTitle').value.trim(),
    content:     orNull($('iContent').value),
    comment:     orNull($('iComment').value),
    reference:   orNull($('iReference').value)
  };
  if (!payload.name || !payload.title) return alert('성명과 제목을 입력하세요.');

  $('saveBtn').disabled = true;
  const res = editingId
    ? await db.from('records').update(payload).eq('id', editingId).select()
    : await db.from('records').insert(payload).select();
  $('saveBtn').disabled = false;

  if (res.error) return alert('저장 실패: ' + res.error.message);
  if (!res.data.length) return alert('저장되지 않았습니다. (권한을 확인하세요)');

  const savedId = res.data[0].id;
  const wasEdit = !!editingId;
  $('formDlg').close();
  if (!wasEdit) page = 0;
  loadOptions();
  await loadList();
  if (wasEdit) openDetail(savedId);
});

/* ---------- 출력 양식 ---------- */
function rich(text) {
  return esc(text).split('\n').map(line => {
    line = line.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^\s*\d+\.\s/.test(line)) return `<b>${line}</b>`;
    return line.replace(/^(\s*핵심\s*주제\s*:)/, '<b>$1</b>');
  }).join('\n');
}

function koDate(d) {
  const [y, m, day] = String(d).split('-');
  return `${y}년 ${m}월 ${day}일`;
}

function buildReport(r) {
  const el = document.createElement('div');
  el.className = 'report';
  const who = [r.position, r.name].filter(Boolean).join(' / ');
  const logo = LOGO_URL && !LOGO_URL.includes('여기에')
    ? `<img src="${esc(LOGO_URL)}" crossorigin="anonymous" alt="">` : '';
  el.innerHTML = `
    <h1 class="r-title">축산업계 이슈 공유</h1>
    <table class="r-head">
      <colgroup><col style="width:16%"><col style="width:34%"><col style="width:16%"><col style="width:34%"></colgroup>
      <tr><th>일자</th><td>${esc(koDate(r.record_date))}</td><th>구분</th><td>${esc(r.category)}</td></tr>
      <tr><th>부서명</th><td>${esc(DEPARTMENT)}</td><th>직급/성명</th><td>${esc(who)}</td></tr>
      <tr><th>제목</th><td class="r-subject" colspan="3">${esc(r.title)}</td></tr>
    </table>
    <table class="r-body">
      <tr><th>내용</th><td>${rich(r.content)}</td></tr>
      <tr class="r-comment"><th>코멘트</th><td>${rich(r.comment)}</td></tr>
      <tr class="r-ref"><th>레퍼런스</th><td>${esc(r.reference)}</td></tr>
    </table>
    <div class="r-logo">${logo}</div>`;
  const img = el.querySelector('img');
  if (img) img.addEventListener('error', () => img.remove());
  return el;
}

async function openPreview(ids) {
  if (!ids.length) return alert('출력할 항목을 체크하세요.');
  const { data, error } = await db.from('records').select('*').in('id', ids)
    .order('record_date', { ascending: false }).order('id', { ascending: false });
  if (error) return alert('불러오기 실패: ' + error.message);
  if (!data.length) return alert('출력할 항목을 찾지 못했습니다.');

  previewRecords = data;
  $('pages').replaceChildren(...data.map(buildReport));
  $('previewInfo').textContent = `${data.length}건 · A4 ${data.length}장`;
  $('appView').hidden = true;
  $('previewView').hidden = false;
  window.scrollTo(0, 0);
}

$('backBtn').onclick = () => {
  $('previewView').hidden = true;
  $('appView').hidden = false;
};
$('printBtn').onclick = () => window.print();

/* ---------- PDF 만들기 ---------- */
function pdfFileName() {
  const clean = s => String(s).replace(/[\\/:*?"<>|\n\r]/g, '').trim().slice(0, 40);
  if (previewRecords.length === 1) {
    const r = previewRecords[0];
    return `축산업계이슈_${r.record_date}_${clean(r.title)}.pdf`;
  }
  return `축산업계이슈_${previewRecords.length}건_${today()}.pdf`;
}

async function waitImages(root) {
  const imgs = [...root.querySelectorAll('img')].filter(i => !i.complete);
  await Promise.all(imgs.map(i => new Promise(res => {
    i.addEventListener('load', res, { once: true });
    i.addEventListener('error', res, { once: true });
  })));
}

$('pdfBtn').onclick = async () => {
  const btn = $('pdfBtn');
  const info = $('previewInfo');
  const before = info.textContent;
  btn.disabled = true;
  try {
    await document.fonts.ready;
    await waitImages($('pages'));
    window.scrollTo(0, 0);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const W = 210, H = 297;
    const reports = [...$('pages').children];
    let first = true;
    const addPage = () => { if (!first) pdf.addPage(); first = false; };

    for (let i = 0; i < reports.length; i++) {
      info.textContent = `PDF 만드는 중… (${i + 1}/${reports.length})`;
      const canvas = await html2canvas(reports[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
      const pageH = Math.floor(canvas.width * H / W);

      if (canvas.height <= pageH * 1.02) {
        // 한 장에 들어가는 경우
        addPage();
        const h = Math.min(H, canvas.height * W / canvas.width);
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, h);
      } else {
        // 내용이 길어 여러 장으로 나뉘는 경우
        for (let y = 0; y < canvas.height; y += pageH) {
          const sliceH = Math.min(pageH, canvas.height - y);
          const c = document.createElement('canvas');
          c.width = canvas.width; c.height = sliceH;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
          addPage();
          pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, sliceH * W / canvas.width);
        }
      }
    }
    pdf.save(pdfFileName());
  } catch (e) {
    const hint = e.name === 'SecurityError'
      ? '\n\n로고 이미지 주소를 확인하세요. 깃헙의 "Raw" 주소(raw.githubusercontent.com)를 써야 합니다.' : '';
    alert('PDF 생성 실패: ' + e.message + hint);
  } finally {
    btn.disabled = false;
    info.textContent = before;
  }
};

/* ---------- 닫기 버튼 공통 ---------- */
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => b.closest('dialog').close())
);
</script>
